<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Hypatia Pro | Autonomous Scientific Discovery Platform</title>
    <meta name="description" content="Hypatia Pro is an autonomous scientific discovery platform guiding researchers through hypothesis formulation, literature synthesis, Monte Carlo simulation, and publication." />
    <meta property="og:title" content="Hypatia Pro" />
    <meta property="og:description" content="Hypatia Pro is an autonomous scientific discovery platform guiding researchers through hypothesis formulation, literature synthesis, Monte Carlo simulation, and publication." />
    <link rel="canonical" href="https://ais-pre-k7rvpz32wfi7acn7cwvm35-264192038147.us-east1.run.app" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- KaTeX for Scientific Formulas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

    <script>
        window.process = { 
            env: { NODE_ENV: 'production' },
            version: '',
            versions: {},
            platform: 'browser',
            nextTick: function(cb) { setTimeout(cb, 0); }
        };

        // Live Diagnostic Panel for on-screen debugging
        (function() {
            const errors = [];
            function addDiag(type, text) {
                const lowerText = String(text).toLowerCase();
                if (
                    lowerText.includes('websocket') || 
                    lowerText.includes('connection') || 
                    lowerText.includes('vite') || 
                    lowerText.includes('hmr') || 
                    lowerText.includes('hot module replacement')
                ) {
                    return; // Ignore benign Vite/WebSocket/HMR connection errors
                }
                errors.push({ type, text, time: new Date().toLocaleTimeString() });
                updateDiagUI();
            }
            window.addEventListener('error', function(e) {
                addDiag('error', e.message + ' (' + (e.filename || '').split('/').pop() + ':' + e.lineno + ')');
            });
            window.addEventListener('unhandledrejection', function(e) {
                const reason = e.reason ? (e.reason.message || String(e.reason)) : 'Promise rejection';
                const lowerReason = reason.toLowerCase();
                if (
                    lowerReason.includes('websocket') || 
                    lowerReason.includes('connection') || 
                    lowerReason.includes('vite') || 
                    lowerReason.includes('hmr') || 
                    lowerReason.includes('hot module replacement')
                ) {
                    e.preventDefault();
                    return;
                }
                addDiag('rejection', reason);
            });
            
            const origError = console.error;
            console.error = function(...args) {
                origError.apply(console, args);
                const text = args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' ');
                addDiag('console_err', text);
            };
            
            function updateDiagUI() {
                let div = document.getElementById('diag-panel');
                if (!div) {
                    div = document.createElement('div');
                    div.id = 'diag-panel';
                    div.style.position = 'fixed';
                    div.style.bottom = '15px';
                    div.style.left = '15px';
                    div.style.zIndex = '999999';
                    div.style.background = 'rgba(15, 17, 23, 0.95)';
                    div.style.border = '1px solid #ef4444';
                    div.style.color = '#fca5a5';
                    div.style.padding = '12px';
                    div.style.borderRadius = '12px';
                    div.style.fontSize = '12px';
                    div.style.fontFamily = 'monospace';
                    div.style.maxWidth = '400px';
                    div.style.maxHeight = '250px';
                    div.style.overflow = 'auto';
                    div.style.boxShadow = '0 10px 30px rgba(0,0,0,0.8)';
                    div.style.borderLeft = '4px solid #ef4444';
                    
                    const header = document.createElement('div');
                    header.innerHTML = '<span style="color:#ef4444;font-weight:bold;margin-right:8px;">● DIAGNOSTICS</span> <button onclick="this.parentElement.parentElement.remove()" style="background:none;border:none;color:#94a3b8;cursor:pointer;float:right;font-weight:bold;">×</button><hr style="border-color:rgba(255,255,255,0.1);margin:6px 0;">';
                    div.appendChild(header);
                    
                    const content = document.createElement('div');
                    content.id = 'diag-panel-content';
                    div.appendChild(content);
                    
                    document.body.appendChild(div);
                }
                const content = document.getElementById('diag-panel-content');
                if (content) {
                    content.innerHTML = errors.map(err => 
                        `<div style="margin-bottom:6px;word-break:break-all;"><span style="color:#94a3b8;">[${err.time}]</span> <span style="color:#f87171;">${err.text}</span></div>`
                    ).join('');
                }
            }
            
            // Check if page loaded successfully after 3 seconds
            setTimeout(function() {
                const root = document.getElementById('root');
                if (root && root.childNodes.length === 0 && errors.length === 0) {
                    addDiag('warning', 'App not rendered. Check if dev server completed loading or there is a load-time deadlock.');
                }
            }, 3000);
        })();

        window.onerror = function(msg, url, line, col, error) {
            if (msg === 'Script error.' && !url) return;
            const lowerMsg = String(msg).toLowerCase();
            if (
                lowerMsg.includes('websocket') || 
                lowerMsg.includes('connection') || 
                lowerMsg.includes('vite') || 
                lowerMsg.includes('hmr') || 
                lowerMsg.includes('hot module replacement')
            ) {
                return; // Ignore benign Vite/WebSocket/HMR connection errors
            }
            console.error("Global Error:", msg, url, line, col, error);
            fetch('/api/log', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    type: 'error',
                    message: msg,
                    url: url,
                    line: line,
                    column: col,
                    stack: error ? error.stack : null
                })
            }).catch(e => console.error(e));
        };
        window.addEventListener('unhandledrejection', function(event) {
            const reason = event.reason ? (event.reason.message || String(event.reason)) : 'Unknown rejection';
            const lowerReason = reason.toLowerCase();
            if (
                lowerReason.includes('websocket') || 
                lowerReason.includes('connection') || 
                lowerReason.includes('vite') || 
                lowerReason.includes('hmr') || 
                lowerReason.includes('hot module replacement') ||
                (event.reason && event.reason.stack && event.reason.stack.toLowerCase().includes('vite'))
            ) {
                event.preventDefault();
                return;
            }
            console.error("Unhandled Rejection:", event.reason);
            event.preventDefault();
            fetch('/api/log', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    type: 'unhandledrejection',
                    message: reason,
                    stack: event.reason ? event.reason.stack : null
                })
            }).catch(e => console.error(e));
        });
    </script>

    <style>
        :root {
            /* Theme Variables */
            --glass-bg: rgba(18, 20, 26, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-highlight: rgba(255, 255, 255, 0.03);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            
            --primary-glow: #00f2fe;
            --primary-dim: rgba(0, 242, 254, 0.1);
            --secondary-glow: #4facfe;
            
            --bg-deep: #050507;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --input-bg: rgba(0, 0, 0, 0.3);
            --navbar-bg: rgba(5, 5, 7, 0.9);
            
            --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        :root[data-bs-theme="light"] {
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(0, 0, 0, 0.08);
            --glass-highlight: rgba(0, 0, 0, 0.02);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.06);
            
            --primary-glow: #007299;
            --primary-dim: rgba(0, 114, 153, 0.1);
            --secondary-glow: #004d66;
            
            --bg-deep: #f1f5f9;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --input-bg: rgba(255, 255, 255, 0.8);
            --navbar-bg: rgba(255, 255, 255, 0.95);
        }

        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(79, 172, 254, 0.05) 0%, transparent 35%),
                radial-gradient(circle at 85% 30%, rgba(166, 74, 255, 0.03) 0%, transparent 35%);
            background-attachment: fixed;
            color: var(--text-primary);
            font-family: var(--font-sans);
            overflow-x: hidden;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Glass Components */
        .card, .modal-content, .dropdown-menu, .list-group-item {
            background: var(--glass-bg) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border) !important;
            box-shadow: var(--glass-shadow);
            color: var(--text-primary);
        }

        .navbar {
            background: var(--navbar-bg) !important;
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
        }

        /* Interactive Elements */
        .btn-primary {
            background: linear-gradient(135deg, var(--primary-glow), var(--secondary-glow));
            border: none;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.15);
            color: #fff !important;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 0.8rem;
            padding: 0.6rem 1.4rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        :root[data-bs-theme="dark"] .btn-primary {
            color: #000 !important;
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.35);
        }
        
        .form-control, .form-select {
            background: var(--input-bg) !important;
            border: 1px solid var(--glass-border) !important;
            color: var(--text-primary) !important;
            font-size: 0.95rem;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--primary-glow) !important;
            box-shadow: 0 0 0 2px var(--primary-dim) !important;
            color: var(--text-primary) !important;
        }

        /* Utility Classes */
        .text-primary-glow { color: var(--primary-glow) !important; }
        .bg-primary-glow { background-color: var(--primary-glow) !important; }
        .font-mono { font-family: var(--font-mono); }
        .ls-1 { letter-spacing: 0.05em; }

        /* Workspace Column Layout */
        .workspace-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            padding: 1.5rem;
            max-width: 1600px;
            margin: 0 auto;
        }
        .sidebar-nav {
            display: none;
        }
        
        /* Mobile/Tablet Responsiveness */
        @media (max-width: 992px) {
            .workspace-container {
                display: block;
                padding: 1rem;
                gap: 1rem;
            }
            .sidebar-nav {
                position: relative;
                top: 0;
                width: 100%;
                margin-bottom: 1.5rem;
            }
        }
        
        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeIn 0.4s ease-out; }
    </style>
