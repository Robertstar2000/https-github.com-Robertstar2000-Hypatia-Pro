<head>

    <!-- KaTeX for Scientific Formulas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

    <script>
        // Polyfill process for browser libraries
        window.process = { 
            env: { NODE_ENV: 'production' },
            version: '',
            versions: {},
            platform: 'browser',
            nextTick: function(cb) { setTimeout(cb, 0); }
        };

        // Mock WebSocket for vite-hmr to prevent unhandled rejection in iframe preview
        if (typeof window !== 'undefined' && window.WebSocket) {
            var OrigWS = window.WebSocket;
            var MockWS = function(url, protocols) {
                if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.includes('token=') || url.includes('vite-hmr')))) {
                    var listeners = {};
                    return {
                        readyState: 1,
                        OPEN: 1,
                        CLOSED: 3,
                        CLOSING: 2,
                        CONNECTING: 0,
                        send: function() {},
                        close: function() {},
                        addEventListener: function(event, fn) {
                            listeners[event] = listeners[event] || [];
                            listeners[event].push(fn);
                            if (event === 'open') setTimeout(fn, 0);
                        },
                        removeEventListener: function(event, fn) {
                            if (listeners[event]) listeners[event] = listeners[event].filter(function(f) { return f !== fn; });
                        },
                        dispatchEvent: function() { return true; }
                    };
                }
                return new OrigWS(url, protocols);
            };
            MockWS.prototype = OrigWS.prototype;
            MockWS.OPEN = 1;
            MockWS.CLOSED = 3;
            MockWS.CLOSING = 2;
            MockWS.CONNECTING = 0;
            window.WebSocket = MockWS;
        }

        // Suppress benign Vite/HMR WebSocket connection errors in iframe preview
        window.addEventListener('unhandledrejection', function(e) {
            var reason = e.reason ? (e.reason.message || String(e.reason)) : '';
            var lowerReason = reason.toLowerCase();
            var stack = (e.reason && e.reason.stack) ? String(e.reason.stack).toLowerCase() : '';
            if (
                lowerReason.includes('websocket') || 
                lowerReason.includes('connection') || 
                lowerReason.includes('vite') || 
                lowerReason.includes('hmr') || 
                lowerReason.includes('hot module replacement') ||
                stack.includes('@vite/client') ||
                stack.includes('websocket')
            ) {
                e.preventDefault();
                e.stopPropagation();
                if (typeof e.stopImmediatePropagation === 'function') e.stopImmediatePropagation();
            }
        }, true);

        window.onerror = function(msg, url, line, col, error) {
            if (msg === 'Script error.' && !url) return true;
            var lowerMsg = String(msg || '').toLowerCase();
            var lowerUrl = String(url || '').toLowerCase();
            var stack = (error && error.stack) ? String(error.stack).toLowerCase() : '';
            if (
                lowerMsg.includes('websocket') || 
                lowerMsg.includes('connection') || 
                lowerMsg.includes('vite') || 
                lowerMsg.includes('hmr') || 
                lowerUrl.includes('@vite/client') ||
                stack.includes('@vite/client')
            ) {
                return true; // Ignore benign Vite/WebSocket/HMR connection errors
            }
        };
    </script>

    <style>
        :root {
            /* Theme Variables */
            --glass-bg: rgba(18, 20, 26, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-highlight: rgba(255, 255, 255, 0.03);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            
            --primary-glow: #00f2fe;
            --primary-dim: rgba(0, 242, 254, 0.1);
            --secondary-glow: #4facfe;
            
            --bg-deep: #050507;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --input-bg: rgba(0, 0, 0, 0.3);
            --navbar-bg: rgba(5, 5, 7, 0.9);
            
            --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        :root[data-bs-theme="light"] {
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(0, 0, 0, 0.08);
            --glass-highlight: rgba(0, 0, 0, 0.02);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.06);
            
            --primary-glow: #007299;
            --primary-dim: rgba(0, 114, 153, 0.1);
            --secondary-glow: #004d66;
            
            --bg-deep: #f1f5f9;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --input-bg: rgba(255, 255, 255, 0.8);
            --navbar-bg: rgba(255, 255, 255, 0.95);
        }

        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(79, 172, 254, 0.05) 0%, transparent 35%),
                radial-gradient(circle at 85% 30%, rgba(166, 74, 255, 0.03) 0%, transparent 35%);
            background-attachment: fixed;
            color: var(--text-primary);
            font-family: var(--font-sans);
            overflow-x: hidden;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Glass Components */
        .card, .modal-content, .dropdown-menu, .list-group-item {
            background: var(--glass-bg) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border) !important;
            box-shadow: var(--glass-shadow);
            color: var(--text-primary);
        }

        .navbar {
            background: var(--navbar-bg) !important;
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
        }

        /* Interactive Elements */
        .btn-primary {
            background: linear-gradient(135deg, var(--primary-glow), var(--secondary-glow));
            border: none;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.15);
            color: #fff !important;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 0.8rem;
            padding: 0.6rem 1.4rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        :root[data-bs-theme="dark"] .btn-primary {
            color: #000 !important;
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.35);
        }
        
        .form-control, .form-select {
            background: var(--input-bg) !important;
            border: 1px solid var(--glass-border) !important;
            color: var(--text-primary) !important;
            font-size: 0.95rem;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--primary-glow) !important;
            box-shadow: 0 0 0 2px var(--primary-dim) !important;
            color: var(--text-primary) !important;
        }

        /* Utility Classes */
        .text-primary-glow { color: var(--primary-glow) !important; }
        .bg-primary-glow { background-color: var(--primary-glow) !important; }
        .font-mono { font-family: var(--font-mono); }
        .ls-1 { letter-spacing: 0.05em; }

        /* Workspace Column Layout */
        .workspace-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            padding: 1.5rem;
            max-width: 1600px;
            margin: 0 auto;
        }
        .sidebar-nav {
            display: none;
        }
        
        /* Mobile/Tablet Responsiveness */
        @media (max-width: 992px) {
            .workspace-container {
                display: block;
                padding: 1rem;
                gap: 1rem;
            }
            .sidebar-nav {
                position: relative;
                top: 0;
                width: 100%;
                margin-bottom: 1.5rem;
            }
        }
        
        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeIn 0.4s ease-out; }
    </style>
